name: Build Release APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Decode upload keystore
        id: keystore
        env:
          K_B64: ${{ secrets.PDFCRAFT_KEYSTORE_B64 }}
        run: |
          if [ -n "${K_B64}" ]; then
            printf '%s' "${K_B64}" | base64 -d > "${GITHUB_WORKSPACE}/upload-keystore.jks"
            echo "present=true" >> "${GITHUB_OUTPUT}"
          else
            echo "present=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build release APK
        env:
          PDFCRAFT_KEYSTORE_PATH: ${{ steps.keystore.outputs.present == 'true' && format('{0}/upload-keystore.jks', github.workspace) || '' }}
          PDFCRAFT_KEYSTORE_PASSWORD: ${{ secrets.PDFCRAFT_KEYSTORE_PASSWORD }}
          PDFCRAFT_KEY_ALIAS: ${{ secrets.PDFCRAFT_KEY_ALIAS }}
          PDFCRAFT_KEY_PASSWORD: ${{ secrets.PDFCRAFT_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PDFCraftStudio-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Build release AAB
        env:
          PDFCRAFT_KEYSTORE_PATH: ${{ steps.keystore.outputs.present == 'true' && format('{0}/upload-keystore.jks', github.workspace) || '' }}
          PDFCRAFT_KEYSTORE_PASSWORD: ${{ secrets.PDFCRAFT_KEYSTORE_PASSWORD }}
          PDFCRAFT_KEY_ALIAS: ${{ secrets.PDFCRAFT_KEY_ALIAS }}
          PDFCRAFT_KEY_PASSWORD: ${{ secrets.PDFCRAFT_KEY_PASSWORD }}
        run: gradle bundleRelease --stacktrace

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: PDFCraftStudio-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
